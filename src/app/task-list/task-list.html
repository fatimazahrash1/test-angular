<p>{{ count() }} tâche(s) au total — {{ remainingCount() }} restante(s)</p>

<button type="button" (click)="addTask()">Ajouter une tâche</button>
<button type="button" (click)="clearTasks()">Vider</button>

@if (tasks().length === 0) {
  <p class="empty" [style.color]="'red'">No tasks available.</p>
} @else {
  <div class="task-grid">
    @for (task of tasks(); track task.id) {
      <app-task-card
        [task]="task"
        (completed)="onCompleted($event)"
      />
    }
  </div>
}
