@if (tasks.length === 0) {
    <!-- Option 1 : Mettre le texte directement en rouge en CSS/style inline -->
    <p class="empty" [style.color]="'red'">No tasks available.</p>
} @else {
    <ul>
        @for (task of tasks; track task.id) {
            <li>{{ task.dueDate | date:'dd/MM/yyyy' }}</li>
            <li [style.color]="task.title | titleColor">{{ task.title | uppercase }}</li>
        }
    </ul>
}
